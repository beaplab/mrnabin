# KLV (klv.binner.KLVBinner): KNN + Leiden seeds, merged by VLP.
# Applied over base_dbv_config.yaml and base_knn_config.yaml, which configure
# the DBV length schedule and the KNN seeding.

# The largest vlp_seed_bins KNN bins seed VLP; merging stops when held-out fit
# per base drops by more than vlp_tolerance. vlp_holdout: false runs DBV's merge.
vlp_seed_bins: 32
vlp_holdout: true
vlp_tolerance: 0.002
